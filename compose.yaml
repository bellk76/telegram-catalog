name: telegram-catalog

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio-perms:
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c", "chown -R 100:101 /data"]
    volumes:
      - miniodata:/data
    logging: *default-logging
    restart: "no"

  minio:
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "100:101"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: docker.io/rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio"
          sleep 2
        done
        until mc ready local; do
          echo "waiting for minio"
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        cat > /tmp/catalog-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$$MINIO_BUCKET","arn:aws:s3:::$$MINIO_BUCKET/*"]}]}
        EOF
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD"
        if mc admin policy info local catalog-policy >/dev/null 2>&1; then
          mc admin policy detach local catalog-policy --user "$$MINIO_APP_USER" >/dev/null 2>&1 || true
          mc admin policy remove local catalog-policy
        fi
        mc admin policy create local catalog-policy /tmp/catalog-policy.json
        mc admin policy attach local catalog-policy --user "$$MINIO_APP_USER"
        mc admin user info local "$$MINIO_APP_USER" | grep -q "catalog-policy"
        echo "minio ready"
    depends_on:
      minio:
        condition: service_started
    logging: *default-logging
    restart: "no"

  migrate:
    build:
      context: ./api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_APP_USER: ${MINIO_APP_USER:-catalog-app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?API_INTERNAL_TOKEN is required}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/ready', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
        BOT_INTERNAL_URL: ${BOT_INTERNAL_URL:-http://bot:8080}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      BOT_INTERNAL_URL: ${BOT_INTERNAL_URL:-http://bot:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/products?limit=1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:?API_INTERNAL_TOKEN is required}
      BOT_MODE: ${BOT_MODE:-webhook}
      ALLOW_POLLING: ${ALLOW_POLLING:-false}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  api-tests:
    profiles: ["test"]
    build:
      context: ./api
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      MINIO_APP_PASSWORD: test-minio-password
      API_INTERNAL_TOKEN: test-internal-token
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  bot-tests:
    profiles: ["test"]
    build:
      context: ./bot
      dockerfile: Dockerfile.test
    environment:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_IDS: "1,2"
      WEBAPP_URL: https://example.com/
      API_INTERNAL_URL: http://api:8000
      API_INTERNAL_TOKEN: test-internal-token
    logging: *default-logging
    restart: "no"

volumes:
  pgdata:
  miniodata:
